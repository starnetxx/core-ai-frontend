<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE Demo</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Invisible clickable hotspot over the top-left "CORE World Model" logo & text in the iframe header */
        .home-hotspot-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px 16px;
            pointer-events: none;
            z-index: 9999;
            display: flex;
            justify-content: center;
        }

        .home-hotspot-container {
            width: 100%;
            max-width: 64rem; /* matches Tailwind max-w-5xl (1024px) inside the app */
            display: flex;
            align-items: center;
        }

        .home-hotspot-link {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            width: 240px;
            height: 44px;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="home-hotspot-wrapper">
        <div class="home-hotspot-container">
            <a href="/" class="home-hotspot-link" aria-label="Back to CORE Home" title="Back to Home"></a>
        </div>
    </div>

    <iframe 
        id="demo-iframe"
        title="CORE Demo"
        allow="accelerometer; camera; microphone"
    ></iframe>
    <script>
        const iframe = document.getElementById('demo-iframe');
        if (window.location.pathname.startsWith('/signin')) {
            iframe.src = 'https://starnetwork-coreworldmodel.hf.space/';
        } else {
            iframe.src = 'https://core-console-eight.vercel.app/';
        }
    </script>
</body>
</html>
